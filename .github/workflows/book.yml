name: Book Dolores tennis

on:
  schedule:
    # Times are UTC. Each window is listed twice (PDT and PST offsets);
    # the script skips the copy that doesn't line up with Pacific time.
    # 8 AM window (Courts 1 & 2, 7 days ahead): start ~7:45 AM PT, Mon-Fri
    - cron: "45 14,15 * * 1-5"
    # Noon window (Court 3, 2 days ahead): start ~11:45 AM PT, Sat-Wed
    # (Sat->Mon, Sun->Tue, Mon->Wed, Tue->Thu, Wed->Fri)
    - cron: "45 18,19 * * 0,1,2,3,6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (go through everything except clicking Book)"
        type: boolean
        default: true
      mode:
        description: "morning (Courts 1-2) or noon (Court 3)"
        type: choice
        options: [noon, morning]
        default: noon
      target_date:
        description: "Date to book, YYYY-MM-DD (blank = normal rule)"
        required: false
      slot_time:
        description: "Slot to pick, e.g. 6:00 PM (change only for testing)"
        default: "6:00 PM"

concurrency:
  group: dolores-booking
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Microsoft's image already has Chromium + all system packages, so there is
    # no slow/flaky apt install before the 8:00 AM run.
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4

      - name: Run bot
        id: bot
        env:
          REC_EMAIL: ${{ secrets.REC_EMAIL }}
          REC_PASSWORD: ${{ secrets.REC_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          NO_WAIT: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
          TARGET_DATE: ${{ inputs.target_date }}
          SLOT_TIME: ${{ inputs.slot_time || '6:00 PM' }}
        run: |
          pip install --quiet playwright==1.56.0 --break-system-packages 2>/dev/null || pip install --quiet playwright==1.56.0
          python3 book.py

      - name: Email me on success (opens an issue)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('result.json', 'utf8'));
            if (r.status === 'booked' || r.status === 'dry_run') {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: (r.status === 'booked' ? '🎾 ' : '🧪 ') + r.message,
                body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
            }

      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7
